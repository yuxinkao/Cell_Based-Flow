<style>
  /* 1. 右側閱讀區：調深為有明顯溫潤感的「暖燕麥紙色（#f2ece1）」，徹底告別死白 */
  html, body, .main-content-wrap, .main, .main-content {
    background-color: #f2ece1 !important;
    color: #2c2a29 !important;
  }

  /* 頂部搜尋列與輸入框內層：統一壓成暖沙色（#e8e0d2），消除左上角那塊純白方塊 */
  .main-header, .search, .search-input-wrap, .search-input {
    background-color: #e8e0d2 !important;
    color: #2c2a29 !important;
  }
  .main-header {
    border-bottom: 1px solid #d8cfc0 !important;
  }

  /* 2. 左側導覽列：沉穩內斂的「深普魯士藍」＋ 暖棕分隔線 */
  .side-bar {
    background-color: #162436 !important;
    border-right: 3px solid #a1623b !important;
  }

  /* 3. 左上角網站標題：強制單行完全展開不折行 */
  .site-title {
    color: #faf8f5 !important;
    font-weight: 700 !important;
    font-size: 1.35rem !important;
    white-space: nowrap !important;
    letter-spacing: 0.4px;
    border-bottom: 1px solid rgba(194, 133, 94, 0.35);
    padding-left: 12px !important;
    padding-right: 12px !important;
  }

  /* 4. 左側選單文字：調整字級與單行展開，確保較長章節（如 01 章）也不折行 */
  .nav-list .nav-list-item .nav-list-link {
    background-image: none !important;
    background-color: transparent !important;
    color: #cbd5e1 !important;
    font-weight: 500 !important;
    font-size: 0.92rem !important;
    white-space: nowrap !important;
    border-radius: 6px;
    margin: 4px 6px;
    padding-left: 10px !important;
    padding-right: 10px !important;
  }

  /* 5. 右側大標題與次標題：深普魯士藍主字體 ＋ 暖琥珀棕底線 */
  h1 {
    color: #162436 !important;
    font-weight: 700 !important;
    border-bottom: 2px solid #a1623b !important;
    padding-bottom: 8px;
  }
  h2 {
    color: #1e3552 !important;
    font-weight: 600 !important;
    border-bottom: 1px solid #e2dad0 !important;
    padding-bottom: 4px;
  }
  h3, h4 {
    color: #8c4f2b !important;
  }

  /* 6. 超連結與行內程式碼標籤：搭配暖紙張底色的深沙棕標籤 */
  a {
    color: #9a5b36 !important;
  }
  code {
    background-color: #f0e8df !important;
    color: #8c4f2b !important;
    border: 1px solid #dfd3c5 !important;
    border-radius: 4px;
    padding: 2px 6px;
  }

  /* 7. 程式碼區塊（Tcl / Bash 腳本）：深海藍黑底 ＋ 左側暖銅棕邊條 */
  pre.highlight, div.highlighter-rouge {
    background-color: #131d2b !important;
    color: #f8fafc !important;
    border-radius: 8px !important;
    border-left: 4px solid #b87348 !important;
  }
  pre.highlight code {
    background-color: transparent !important;
    color: #e2e8f0 !important;
    border: none !important;
  }

 /* 8. 徹底消除外層白框，讓深藍程式碼卡片獨立呈現，並將所有語法元素調為高對比亮色 */
  div[class*="language-"], div.highlighter-rouge, figure.highlight, .highlight {
    background-color: transparent !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    margin: 18px 0 26px 0 !important;
  }
  pre.highlight, pre {
    background-color: #162436 !important;
    color: #f8fafc !important;
    border-left: 4px solid #a1623b !important;
    border-radius: 8px !important;
    padding: 18px 22px !important;
    font-size: 0.95rem !important;
    line-height: 1.7 !important;
    overflow-x: auto !important;
    box-shadow: 0 3px 10px rgba(22, 36, 54, 0.12) !important;
  }
  pre code {
    background-color: transparent !important;
    color: #f8fafc !important;
    border: none !important;
    padding: 0 !important;
  }
  /* 強制將原本暗紫色的變數與函式名稱（.n, .nv, .nf 等）全部調亮為清晰亮白與天藍 */
  .highlight .n, .highlight .nv, .highlight .nb, .highlight .bp { color: #f8fafc !important; } /* 變數名稱改為純白，不再暗紫糊在一起 */
  .highlight .nf, .highlight .nc, .highlight .nn { color: #7dd3fc !important; font-weight: 600 !important; } /* 模組與函式名稱改為亮天藍 */
  .highlight .c, .highlight .c1, .highlight .cm { color: #94a3b8 !important; font-style: italic !important; } /* 註解改為清晰銀灰 */
  .highlight .k, .highlight .kd, .highlight .kn, .highlight .kp, .highlight .kr, .highlight .kt { color: #fbbf24 !important; font-weight: 600 !important; } /* 關鍵字改為明亮琥珀黃 */
  .highlight .m, .highlight .mi, .highlight .mh, .highlight .mb { color: #4ade80 !important; } /* 數字改為亮翠綠 */
  .highlight .s, .highlight .s1, .highlight .s2 { color: #fde68a !important; } /* 字串改為柔亮黃 */
  .highlight .o, .highlight .p { color: #cbd5e1 !important; } /* 符號與分號改為亮銀白 */

  /* 9. 正文容器置中對齊並適度加寬（1040px），解決右半邊空蕩問題 */
  .main-content-wrap {
    max-width: 1040px !important;
    margin: 0 auto !important;
    padding: 36px 48px !important;
  }
  .main-content {
    max-width: 100% !important;
    padding: 0 !important;
    line-height: 1.8 !important;
  }

  /* 10. 粗體字改為「赤陶紅棕（#9a5b36）」，在暖紙張底色上突顯重點層次 */
  strong, b {
    color: #9a5b36 !important;
    font-weight: 700 !important;
  }

  /* 11. 卡片化引用區塊（作者資訊卡 ＆ 提醒框） */
  blockquote {
    background-color: #e9e1d3 !important;
    border-left: 4px solid #a1623b !important;
    border-radius: 0 8px 8px 0 !important;
    padding: 14px 20px !important;
    margin: 18px 0 26px 0 !important;
    color: #2c2a29 !important;
    box-shadow: 0 2px 5px rgba(22, 36, 54, 0.05) !important;
  }
  blockquote p {
    margin: 4px 0 !important;
  }

  /* 12. 柔和同色系書頁表格：消除純白條紋突兀感，與暖燕麥紙底色（#f2ece1）自然融合 */
  .table-wrapper {
    background-color: transparent !important;
    box-shadow: none !important;
    border: none !important;
    margin: 20px 0 28px 0 !important;
  }
  table {
    width: 100% !important;
    border-collapse: collapse !important;
    border-radius: 8px !important;
    overflow: hidden !important;
    border: 1px solid #d5cab8 !important;
    box-shadow: 0 2px 6px rgba(22, 36, 54, 0.05) !important;
  }
  th {
    background-color: #162436 !important;
    color: #faf8f5 !important;
    font-weight: 600 !important;
    padding: 12px 16px !important;
    text-align: left !important;
    border-bottom: 2px solid #a1623b !important;
  }
  td {
    background-color: #f7f3eb !important; /* 改用柔和象牙紙白，消除純白跳色感 */
    border-bottom: 1px solid #dcd2c2 !important;
    padding: 12px 16px !important;
    color: #2c2a29 !important;
  }
  tr:nth-child(even) td {
    background-color: #ebe3d5 !important; /* 偶數列維持同色調暖沙色，形成低調層次 */
  }

  /* 13. 表格前三欄維持單行不折行，並收斂短欄位寬度避免左半邊空蕩 */
  th:nth-child(1), td:nth-child(1),
  th:nth-child(2), td:nth-child(2),
  th:nth-child(3), td:nth-child(3) {
    white-space: nowrap !important;
    width: 1% !important; /* 讓前幾欄依內容寬度緊湊貼合，把剩餘空間全留給最後一欄說明 */
  }
  th:nth-child(4), td:nth-child(4) {
    width: auto !important;
  }

  /* 修正側邊欄跑掉：強制最外層容器佔滿 100% 螢幕寬度，讓深藍色側邊欄緊貼螢幕最左緣 */
  .page-wrap, .main {
    max-width: 100% !important;
    margin-left: 0 !important;
  }
  .side-bar {
    left: 0 !important;
    width: 300px !important;
  }
  @media (min-width: 66.5rem) {
    .main {
      margin-left: 300px !important;
    }
  }

  /* 14. 工作站檔案路徑專屬提示框（石板青配色，與一般提示卡明確區隔） */
  .ws-path {
    background-color: #eef4f7 !important;
    border-left: 4px solid #2b6cb0 !important;
    border-radius: 6px !important;
    padding: 12px 18px !important;
    margin: 16px 0 22px 0 !important;
    color: #1e293b !important;
    font-size: 0.94rem !important;
    line-height: 1.65 !important;
  }
  .ws-path strong {
    color: #1e40af !important;
  }
  .ws-path code {
    background-color: #dce8f2 !important;
    color: #0f172a !important;
    border: 1px solid #bfdbfe !important;
    font-weight: 600 !important;
    padding: 2px 6px !important;
  }

  /* 15. 章節頁尾到底提示與下一章切換按鈕（採用全站深海軍藍與暖大地棕主色） */
  .page-end-nav {
    margin-top: 48px !important;
    padding-top: 24px !important;
    border-top: 1px dashed #d6cbbd !important;
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    flex-wrap: wrap !important;
    gap: 16px !important;
  }
  .page-end-text {
    color: #6e5d4f !important;
    font-size: 0.92rem !important;
    font-weight: 500 !important;
  }
  .next-chapter-btn {
    display: inline-flex !important;
    align-items: center !important;
    background-color: #142334 !important;
    color: #f4efe6 !important;
    border: 1px solid #8b5a2b !important;
    text-decoration: none !important;
    padding: 10px 22px !important;
    border-radius: 6px !important;
    font-weight: 600 !important;
    font-size: 0.95rem !important;
    box-shadow: 0 2px 6px rgba(20, 35, 52, 0.12) !important;
    transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease !important;
  }
  .next-chapter-btn:hover {
    background-color: #8b5a2b !important;
    border-color: #8b5a2b !important;
    color: #ffffff !important;
    transform: translateY(-1px) !important;
  }

  /* 16. 側邊欄當前所在章節（Active）實心暖琥珀棕底配白字 */
  .side-bar .nav-list .nav-list-item > .nav-list-link.active {
    background-color: #a1623b !important;
    color: #ffffff !important;
    font-weight: 700 !important;
    border-left: none !important;
    border-radius: 6px !important;
    padding-left: 16px !important;
  }
</style>

<div id="luoluo-mascot-widget" class="mascot-container is-right is-bottom" data-state="intro1" data-min="0">
  <div id="mascot-speech-bubble" class="mascot-bubble">哈囉！我是蘿蘿 👋</div>
  <div class="mascot-card" id="mascot-drag-card">
    <button type="button" id="mascot-min-btn" class="mascot-toggle-btn" title="縮小／展開" onclick="window.mascotMin()">-</button>
    <div class="mascot-click-area">
      <img id="mascot-gif" src="{{ '/intro.gif' | relative_url }}" data-base="{{ '/' | relative_url }}" alt="蘿蘿與大狗狗互動小劇場" draggable="false" />
    </div>
    <div class="mascot-actions" id="mascot-actions">
      <button type="button" class="mascot-action-btn" onclick="window.mascotGo('next')">認識大狗狗 🐾</button>
    </div>
    <div id="mascot-resize-handle" class="mascot-resize-handle" title="按住拖曳自由放大或縮小"></div>
  </div>
</div>

<style>
  .mascot-container {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: auto;
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .mascot-container.is-left {
    align-items: flex-start;
  }
  .mascot-container.is-top .mascot-card {
    order: 1;
  }
  .mascot-container.is-top .mascot-bubble {
    order: 2;
    margin-top: 8px;
    margin-bottom: 0;
  }
  .mascot-container.is-top .mascot-bubble::after {
    top: -6px;
    bottom: auto;
    border-left: 1.5px solid #d4b89c;
    border-top: 1.5px solid #d4b89c;
    border-right: none;
    border-bottom: none;
  }
  .mascot-container.is-bottom .mascot-bubble {
    order: 1;
    margin-bottom: 8px;
    margin-top: 0;
  }
  .mascot-container.is-bottom .mascot-card {
    order: 2;
  }
  .mascot-container.is-bottom .mascot-bubble::after {
    bottom: -6px;
    top: auto;
    border-right: 1.5px solid #d4b89c;
    border-bottom: 1.5px solid #d4b89c;
    border-left: none;
    border-top: none;
  }
  .mascot-container.is-right .mascot-bubble::after {
    right: 32px;
    left: auto;
  }
  .mascot-container.is-left .mascot-bubble::after {
    left: 32px;
    right: auto;
  }
  .mascot-card {
    position: relative;
    background: #ffffff;
    border: 2px solid #d4b89c;
    border-radius: 20px;
    padding: 8px 10px 8px;
    box-shadow: 0 8px 20px rgba(60, 42, 28, 0.16);
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: grab;
  }
  .mascot-card:active {
    cursor: grabbing;
  }
  .mascot-card:hover {
    border-color: #9e5a2b;
  }
  .mascot-card img {
    width: 155px;
    height: auto;
    display: block;
    border-radius: 14px;
    pointer-events: none;
  }
  .mascot-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 5px;
    margin-top: 6px;
    width: 100%;
  }
  .mascot-action-btn {
    background: rgba(158, 90, 43, 0.94);
    color: #ffffff;
    border: none;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 99px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    cursor: pointer;
    line-height: 1.3;
  }
  .mascot-action-btn:hover {
    background: #7c431c;
  }
  .mascot-action-btn.is-danger {
    background: #d9534f;
  }
  .mascot-action-btn.is-danger:hover {
    background: #b93c38;
  }
  .mascot-action-btn.is-soft {
    background: #e89b5a;
  }
  .mascot-action-btn.is-soft:hover {
    background: #d18240;
  }
  .mascot-bubble {
    background: #fdfbf7;
    color: #5c3d28;
    border: 1.5px solid #d4b89c;
    border-radius: 15px;
    padding: 7px 12px;
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.4;
    max-width: 210px;
    text-align: center;
    box-shadow: 0 4px 12px rgba(74, 53, 37, 0.14);
    position: relative;
  }
  .mascot-bubble::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    background: #fdfbf7;
    transform: rotate(45deg);
  }
  .mascot-container[data-state="fight"] .mascot-bubble {
    background: #fff5f5;
    border-color: #d96b6b;
    color: #b83b3b;
  }
  .mascot-container[data-state="fight"] .mascot-bubble::after {
    background: #fff5f5;
    border-color: #d96b6b;
  }
  .mascot-toggle-btn {
    position: absolute;
    top: -8px;
    left: -8px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid #d4b89c;
    background: #fdfbf7;
    color: #5c3d28;
    font-size: 14px;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.16);
    z-index: 10;
    padding: 0;
  }
  .mascot-toggle-btn:hover {
    background: #9e5a2b;
    color: #fff;
  }
  .mascot-resize-handle {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 18px;
    height: 18px;
    cursor: nwse-resize;
    z-index: 12;
    border-bottom-right-radius: 16px;
    opacity: 0.55;
    background: linear-gradient(135deg, transparent 45%, #9e5a2b 45%, #9e5a2b 58%, transparent 58%, transparent 72%, #9e5a2b 72%, #9e5a2b 85%, transparent 85%);
  }
  .mascot-card:hover .mascot-resize-handle {
    opacity: 1;
  }
  .mascot-container.is-minimized .mascot-bubble,
  .mascot-container.is-minimized .mascot-click-area,
  .mascot-container.is-minimized .mascot-resize-handle {
    display: none;
  }
  .mascot-container.is-minimized .mascot-card {
    padding: 6px 12px;
    border-radius: 99px;
  }
  .mascot-container.is-minimized .mascot-actions {
    margin-top: 0;
  }
</style>

<script src="{{ '/mascot.js' | relative_url }}"></script>

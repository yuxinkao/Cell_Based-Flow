<style>
  /* 右下角小蘿蘿互動總容器（完全無框，直接站在網頁角落） */
  .mascot-wrapper {
    position: fixed;
    bottom: 16px;
    right: 28px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    user-select: none;
  }

  /* 手繪感對話氣泡 */
  .mascot-bubble {
    background-color: #fbf8f1;
    color: #5c3a1a;
    border: 2px solid #8c5828;
    border-radius: 16px 16px 2px 16px;
    padding: 8px 14px;
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.45;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgba(26, 38, 52, 0.14);
    margin-bottom: 6px;
    opacity: 0.95;
    transform: translateY(0) scale(1);
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .mascot-wrapper:hover .mascot-bubble,
  .mascot-wrapper.active .mascot-bubble {
    opacity: 1;
    transform: translateY(-4px) scale(1.04);
    border-color: #b87333;
    background-color: #fffdf8;
  }

  /* 透明點擊舞台（完全沒有圓框與白底） */
  .corner-mascot {
    position: relative;
    width: 84px;
    height: 84px;
    background: transparent;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* 腳底淡淡的橢圓小影子，讓角色有站在網頁上的立體感 */
  .mascot-shadow {
    position: absolute;
    bottom: 6px;
    width: 38px;
    height: 8px;
    background: rgba(92, 58, 26, 0.18);
    border-radius: 50%;
    pointer-events: none;
    animation: shadowPulse 2.4s ease-in-out infinite;
  }

  /* 小蘿蘿本體：透過 multiply 濾掉圖檔白底，只留手繪線條與色彩 */
  .mascot-character {
    width: 84px;
    height: 84px;
    object-fit: contain;
    mix-blend-mode: multiply;
    pointer-events: none;
    animation: gentleBounce 2.4s ease-in-out infinite;
  }

  .corner-mascot:hover:not(.tripped) .mascot-character {
    animation: happyWiggle 0.6s ease-in-out infinite;
  }

  /* 灰塵小粒子 */
  .dust-puff {
    position: absolute;
    bottom: 10px;
    font-size: 15px;
    opacity: 0;
    pointer-events: none;
  }
  .dust-left { left: 4px; }
  .dust-right { right: 4px; }

  /* 點擊觸發：往左邊撲通摔倒 -> 趴地暈眩 -> 爬起來 -> 拍拍灰塵 */
  .corner-mascot.tripped .mascot-character {
    animation: fallOutAndDust 2.6s cubic-bezier(0.22, 1, 0.36, 1) forwards !important;
  }
  .corner-mascot.tripped .mascot-shadow {
    animation: shadowTrip 2.6s ease-in-out forwards !important;
  }
  .corner-mascot.tripped .dust-left {
    animation: puffLeft 2.6s ease-out forwards;
  }
  .corner-mascot.tripped .dust-right {
    animation: puffRight 2.6s ease-out forwards;
  }

  @keyframes gentleBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  @keyframes shadowPulse {
    0%, 100% { transform: scale(1); opacity: 0.22; }
    50% { transform: scale(0.82); opacity: 0.12; }
  }

  @keyframes happyWiggle {
    0%, 100% { transform: scale(1.06) rotate(0deg); }
    25% { transform: scale(1.08) rotate(-8deg); }
    75% { transform: scale(1.08) rotate(8deg); }
  }

  /* 劇本：嚇一跳彈起 -> 往左飛撲橫躺摔倒 -> 爬起來 -> 左右扭動拍灰塵 */
  @keyframes fallOutAndDust {
    0%   { transform: translate(0, 0) rotate(0deg); }
    10%  { transform: translate(-10px, -22px) rotate(-18deg); }
    22%  { transform: translate(-42px, 12px) rotate(-88deg); }
    27%  { transform: translate(-40px, 7px) rotate(-82deg); }
    46%  { transform: translate(-42px, 12px) rotate(-88deg); }
    58%  { transform: translate(-26px, -4px) rotate(-32deg); }
    68%  { transform: translate(-6px, -10px) rotate(10deg); }
    74%  { transform: translate(0, 0) rotate(0deg); }
    79%  { transform: scale(1.06, 0.92) translate(0, 3px) rotate(-12deg); }
    84%  { transform: scale(0.95, 1.06) translate(0, -3px) rotate(12deg); }
    89%  { transform: scale(1.06, 0.92) translate(0, 3px) rotate(-10deg); }
    94%  { transform: scale(0.96, 1.04) translate(0, -2px) rotate(8deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  @keyframes shadowTrip {
    0%, 100% { transform: translateX(0) scaleX(1); opacity: 0.22; }
    22%, 46% { transform: translateX(-42px) scaleX(1.6); opacity: 0.28; }
    74%      { transform: translateX(0) scaleX(1); opacity: 0.22; }
  }

  @keyframes puffLeft {
    0%, 76% { opacity: 0; transform: translate(0, 0) scale(0.5); }
    82%     { opacity: 0.95; transform: translate(-14px, -6px) scale(1.1); }
    95%     { opacity: 0; transform: translate(-24px, -14px) scale(1.3); }
    100%    { opacity: 0; }
  }
  @keyframes puffRight {
    0%, 80% { opacity: 0; transform: translate(0, 0) scale(0.5); }
    86%     { opacity: 0.95; transform: translate(14px, -6px) scale(1.1); }
    98%     { opacity: 0; transform: translate(24px, -14px) scale(1.3); }
    100%    { opacity: 0; }
  }
</style>

<div class="mascot-wrapper" id="mascotWrapper">
  <div class="mascot-bubble" id="mascotBubble">欸欸！戳我一下嘛～🐷</div>
  <div class="corner-mascot" id="cornerMascot">
    <div class="mascot-shadow"></div>
    <img src="{{ '/runner.gif' | relative_url }}" alt="小蘿蘿吉祥物" class="mascot-character">
    <span class="dust-puff dust-left">💨</span>
    <span class="dust-puff dust-right">💨</span>
  </div>
</div>

<script>
  (function() {
    const wrapper = document.getElementById('mascotWrapper');
    const mascot = document.getElementById('cornerMascot');
    const bubble = document.getElementById('mascotBubble');

    const idlePrompts = [
      "欸欸！戳我一下嘛～🐷",
      "一個人站在角落好無聊…點我陪我玩！",
      "看講義累了嗎？戳戳看我會怎樣 ✨",
      "豬豬帽歪掉了嗎？幫我點一下～🍃"
    ];

    const tripQuotes = [
      "哇啊！撲通——摔個四腳朝天啦！🐷💦",
      "哎呀！被 Timing Violation 絆倒了…😵‍💫",
      "嗚哇！好痛痛，地板硬硬的啦～",
      "等我一下…我這就自己爬起來…🌱",
      "嚇我一跳！差點撞到 Scan Chain 啦！✨",
      "哎唷喂～再戳我一次就要生氣氣囉（才怪）"
    ];

    let idleIdx = 0;
    let tripIdx = 0;
    let dustTimer;
    let resetTimer;

    setInterval(function() {
      if (!mascot.classList.contains('tripped') && !wrapper.matches(':hover')) {
        idleIdx = (idleIdx + 1) % idlePrompts.length;
        bubble.textContent = idlePrompts[idleIdx];
      }
    }, 6000);

    mascot.addEventListener('click', function() {
      mascot.classList.remove('tripped');
      void mascot.offsetWidth;
      mascot.classList.add('tripped');

      bubble.textContent = tripQuotes[tripIdx];
      tripIdx = (tripIdx + 1) % tripQuotes.length;
      wrapper.classList.add('active');

      clearTimeout(dustTimer);
      clearTimeout(resetTimer);

      dustTimer = setTimeout(function() {
        bubble.textContent = "拍拍灰塵～呼，好險豬豬帽還在！💨🐷";
      }, 1900);

      resetTimer = setTimeout(function() {
        mascot.classList.remove('tripped');
        wrapper.classList.remove('active');
        bubble.textContent = "站好囉！還要再戳我嗎？✨";
      }, 3500);
    });

    mascot.addEventListener('dblclick', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      bubble.textContent = "咻——抱著豬豬帽飛回頂端囉！🚀";
    });
  })();
</script>

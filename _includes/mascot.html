<div id="luoluo-mascot-widget" class="mascot-container" data-state="intro">
  <div id="mascot-speech-bubble" class="mascot-bubble" onclick="window.handleMascotClick(event)">
    哈囉！我是蘿蘿和大狗狗 👋
  </div>
  <div class="mascot-card" title="點一下與蘿蘿和大狗狗互動！">
    <button type="button" class="mascot-toggle-btn" onclick="window.toggleMascotMinimize(event)" title="縮小／展開">−</button>
    <div class="mascot-click-area" onclick="window.handleMascotClick(event)">
      <img id="mascot-gif" src="{{ '/intro.gif' | relative_url }}" alt="蘿蘿與大狗狗互動小劇場" />
      <span class="mascot-hint-badge" id="mascot-badge">點我互動</span>
    </div>
  </div>
</div>

<style>
  .mascot-container {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 999999;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    user-select: none;
    pointer-events: auto !important;
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .mascot-bubble {
    background: #fdfbf7;
    color: #5c3d28;
    border: 1.5px solid #d4b89c;
    border-radius: 14px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.35;
    max-width: 195px;
    text-align: center;
    box-shadow: 0 4px 12px rgba(74, 53, 37, 0.14);
    margin-bottom: 8px;
    position: relative;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .mascot-bubble::after {
    content: "";
    position: absolute;
    bottom: -6px;
    right: 28px;
    width: 10px;
    height: 10px;
    background: #fdfbf7;
    border-right: 1.5px solid #d4b89c;
    border-bottom: 1.5px solid #d4b89c;
    transform: rotate(45deg);
  }
  .mascot-container[data-state="fight"] .mascot-bubble {
    background: #fff5f5;
    border-color: #d96b6b;
    color: #b83b3b;
    animation: gentle-float 1.4s infinite ease-in-out;
  }
  .mascot-container[data-state="fight"] .mascot-bubble::after {
    background: #fff5f5;
    border-color: #d96b6b;
  }
  .mascot-card {
    position: relative;
    background: #ffffff;
    border: 2px solid #d4b89c;
    border-radius: 20px;
    padding: 6px 8px 4px;
    box-shadow: 0 8px 20px rgba(60, 42, 28, 0.18);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .mascot-click-area {
    cursor: pointer;
    position: relative;
  }
  .mascot-card:hover {
    transform: translateY(-2px);
    border-color: #9e5a2b;
  }
  .mascot-card img {
    width: 125px;
    height: auto;
    display: block;
    border-radius: 14px;
    pointer-events: none;
  }
  .mascot-hint-badge {
    position: absolute;
    bottom: 4px;
    right: 4px;
    background: rgba(158, 90, 43, 0.92);
    color: #fff;
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 99px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    opacity: 1;
    pointer-events: none;
  }
  .mascot-container[data-state="fight"] .mascot-hint-badge {
    background: #d9534f;
  }
  /* 右上角迷你收合按鈕，不擋住下一章按鍵 */
  .mascot-toggle-btn {
    position: absolute;
    top: -8px;
    left: -8px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid #d4b89c;
    background: #fdfbf7;
    color: #5c3d28;
    font-size: 14px;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    z-index: 10;
    padding: 0;
  }
  .mascot-toggle-btn:hover {
    background: #9e5a2b;
    color: #fff;
    border-color: #9e5a2b;
  }
  /* 縮小狀態樣式 */
  .mascot-container.is-minimized .mascot-bubble,
  .mascot-container.is-minimized .mascot-card img {
    display: none;
  }
  .mascot-container.is-minimized .mascot-card {
    padding: 6px 12px;
    border-radius: 99px;
  }
  .mascot-container.is-minimized .mascot-hint-badge {
    position: static;
    display: inline-block;
  }
  .mascot-container.is-minimized .mascot-toggle-btn {
    top: -6px;
    left: -6px;
    width: 18px;
    height: 18px;
    font-size: 12px;
  }
  @keyframes gentle-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
</style>

<script>
(function() {
  var gifs = {
    intro: "{{ '/intro.gif' | relative_url }}",
    fight: "{{ '/fight.gif' | relative_url }}",
    bonk:  "{{ '/bonk.gif' | relative_url }}",
    pet:   "{{ '/pet.gif' | relative_url }}",
    sleep: "{{ '/sleep.gif' | relative_url }}"
  };
  var durations = { intro: 4000, bonk: 2200, pet: 4500 };
  for (var k in gifs) { var imgPre = new Image(); imgPre.src = gifs[k]; }
  var currentState = "intro";
  var timer = null;
  function setState(newState, text, badgeText) {
    var widget = document.getElementById("luoluo-mascot-widget");
    var bubble = document.getElementById("mascot-speech-bubble");
    var img = document.getElementById("mascot-gif");
    var badge = document.getElementById("mascot-badge");
    if (!widget || !bubble || !img) return;
    currentState = newState;
    widget.setAttribute("data-state", newState);
    bubble.textContent = text;
    if (badge && badgeText) badge.textContent = badgeText;
    img.src = gifs[newState] + "?t=" + Date.now();
  }
  function startFightLoop() {
    setState("fight", "搶軟糖打架了！點一下勸架 🍬", "點我勸架");
  }
  function playBonkSequence() {
    clearTimeout(timer);
    setState("bonk", "咚！不准搶小熊軟糖！", "勸架中...");
    timer = setTimeout(function() {
      setState("pet", "乖乖～不哭不哭（偷藏軟糖）", "和好中");
      timer = setTimeout(function() {
        setState("sleep", "吃飽玩累了，陪你一起讀書 Zzz...", "點我叫醒");
      }, durations.pet);
    }, durations.bonk);
  }
  window.handleMascotClick = function(e) {
    if (e) e.stopPropagation();
    var widget = document.getElementById("luoluo-mascot-widget");
    if (widget && widget.classList.contains("is-minimized")) {
      widget.classList.remove("is-minimized");
      var btn = widget.querySelector(".mascot-toggle-btn");
      if (btn) btn.textContent = "−";
      return;
    }
    if (currentState === "intro") {
      clearTimeout(timer);
      startFightLoop();
    } else if (currentState === "fight") {
      playBonkSequence();
    } else if (currentState === "sleep") {
      clearTimeout(timer);
      setState("intro", "哈囉！我是蘿蘿和大狗狗 👋", "點我互動");
      timer = setTimeout(startFightLoop, durations.intro);
    }
  };
  window.toggleMascotMinimize = function(e) {
    if (e) e.stopPropagation();
    var widget = document.getElementById("luoluo-mascot-widget");
    var btn = e.currentTarget;
    if (!widget) return;
    var minimized = widget.classList.toggle("is-minimized");
    btn.textContent = minimized ? "+" : "−";
  };
  timer = setTimeout(startFightLoop, durations.intro);
})();
</script>

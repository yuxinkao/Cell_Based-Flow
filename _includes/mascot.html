<div id="luoluo-mascot-widget" class="mascot-container" data-state="intro">
  <!-- 迷你精緻對話氣泡 -->
  <div id="mascot-speech-bubble" class="mascot-bubble">
    哈囉！我是蘿蘿和大狗狗 👋
  </div>

  <!-- 圓角小卡片外框，完美包覆 GIF 的白底，質感大升級 -->
  <div class="mascot-card" title="點一下與蘿蘿和大狗狗互動！">
    <img id="mascot-gif" src="{{ '/intro.gif' | relative_url }}" alt="蘿蘿與大狗狗互動小劇場" />
    <span class="mascot-hint-badge" id="mascot-badge">點我互動</span>
  </div>
</div>

<style>
  .mascot-container {
    position: fixed;
    right: 22px;
    bottom: 20px;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    user-select: none;
    pointer-events: auto;
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  /* 貼合網站「暖棕＋米白」質感的對話氣泡 */
  .mascot-bubble {
    background: #fdfbf7;
    color: #5c3d28;
    border: 1.5px solid #d4b89c;
    border-radius: 14px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.35;
    max-width: 195px;
    text-align: center;
    box-shadow: 0 4px 12px rgba(74, 53, 37, 0.12);
    margin-bottom: 8px;
    position: relative;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .mascot-bubble::after {
    content: "";
    position: absolute;
    bottom: -6px;
    right: 28px;
    width: 10px;
    height: 10px;
    background: #fdfbf7;
    border-right: 1.5px solid #d4b89c;
    border-bottom: 1.5px solid #d4b89c;
    transform: rotate(45deg);
  }

  /* 打架狀態時的提醒樣式 */
  .mascot-container[data-state="fight"] .mascot-bubble {
    background: #fff5f5;
    border-color: #d96b6b;
    color: #b83b3b;
    animation: gentle-float 1.4s infinite ease-in-out;
  }

  .mascot-container[data-state="fight"] .mascot-bubble::after {
    background: #fff5f5;
    border-color: #d96b6b;
  }

  /* 把 GIF 裝進圓角小卡片，徹底解決「一塊白方塊」的生硬感 */
  .mascot-card {
    position: relative;
    background: #ffffff;
    border: 2px solid #e6d8c8;
    border-radius: 20px;
    padding: 6px 8px 4px;
    box-shadow: 0 8px 20px rgba(60, 42, 28, 0.14);
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .mascot-card:hover {
    transform: translateY(-3px);
    border-color: #b87a4b;
    box-shadow: 0 10px 24px rgba(60, 42, 28, 0.2);
  }

  .mascot-card:active {
    transform: scale(0.96);
  }

  .mascot-card img {
    width: 138px;
    height: auto;
    display: block;
    border-radius: 14px;
    pointer-events: none;
  }

  /* 右下角小狀態提示標籤 */
  .mascot-hint-badge {
    position: absolute;
    bottom: 6px;
    right: 8px;
    background: rgba(158, 90, 43, 0.85);
    color: #fff;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 99px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .mascot-card:hover .mascot-hint-badge,
  .mascot-container[data-state="fight"] .mascot-hint-badge {
    opacity: 1;
  }

  @keyframes gentle-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  @media (max-width: 640px) {
    .mascot-container {
      right: 12px;
      bottom: 12px;
    }
    .mascot-card img {
      width: 105px;
    }
    .mascot-bubble {
      font-size: 11.5px;
      max-width: 165px;
    }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const widget = document.getElementById("luoluo-mascot-widget");
    const bubble = document.getElementById("mascot-speech-bubble");
    const img = document.getElementById("mascot-gif");
    const badge = document.getElementById("mascot-badge");

    if (!widget || !bubble || !img) return;

    const gifs = {
      intro: "{{ '/intro.gif' | relative_url }}",
      fight: "{{ '/fight.gif' | relative_url }}",
      bonk:  "{{ '/bonk.gif' | relative_url }}",
      pet:   "{{ '/pet.gif' | relative_url }}",
      sleep: "{{ '/sleep.gif' | relative_url }}"
    };

    const durations = {
      intro: 4000,
      bonk:  2200,
      pet:   4500
    };

    Object.values(gifs).forEach((src) => {
      const preload = new Image();
      preload.src = src;
    });

    let currentState = "intro";
    let timer = null;

    function setState(newState, text, badgeText) {
      currentState = newState;
      widget.setAttribute("data-state", newState);
      bubble.textContent = text;
      if (badge && badgeText) badge.textContent = badgeText;
      img.src = gifs[newState] + "?t=" + Date.now();
    }

    function startFightLoop() {
      setState("fight", "搶軟糖打架了！點一下勸架 🍬", "點我勸架");
    }

    function playBonkSequence() {
      clearTimeout(timer);
      setState("bonk", "咚！不准搶小熊軟糖！", "勸架中...");

      timer = setTimeout(() => {
        setState("pet", "乖乖～不哭不哭（偷藏軟糖）", "和好中");

        timer = setTimeout(() => {
          setState("sleep", "吃飽玩累了，陪你一起讀書 Zzz...", "點我叫醒");
        }, durations.pet);
      }, durations.bonk);
    }

    // 1. 開場 4 秒後自動切換成搶軟糖
    timer = setTimeout(startFightLoop, durations.intro);

    // 2. 無論在哪個階段，只要滑鼠點擊卡片或對話框都立刻有反應！
    widget.addEventListener("click", function (e) {
      e.stopPropagation();

      if (currentState === "intro") {
        // 還在打招呼時點一下，直接跳進搶軟糖
        clearTimeout(timer);
        startFightLoop();
      } else if (currentState === "fight") {
        // 搶軟糖時點一下，觸發球棒敲頭 -> 摸頭 -> 睡覺
        playBonkSequence();
      } else if (currentState === "sleep") {
        // 睡著時點一下，重新叫醒打招呼
        clearTimeout(timer);
        setState("intro", "哈囉！我是蘿蘿和大狗狗 👋", "點我互動");
        timer = setTimeout(startFightLoop, durations.intro);
      }
    });
  });
</script>

<div id="luoluo-mascot-widget" class="mascot-container" data-state="intro">
  <div id="mascot-speech-bubble" class="mascot-bubble">
    哈囉大家好！我是蘿蘿～這是我的大狗狗！
  </div>
  <div class="mascot-stage" title="點擊與蘿蘿和大狗狗互動">
    <img id="mascot-gif" src="{{ '/intro.gif' | relative_url }}" alt="蘿蘿與大狗狗互動小劇場" />
  </div>
</div>

<style>
  .mascot-container {
    position: fixed;
    right: 24px;
    bottom: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .mascot-bubble {
    background: #ffffff;
    color: #4a3b32;
    border: 2px solid #f4b6c2;
    border-radius: 18px;
    padding: 8px 14px;
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.4;
    max-width: 210px;
    text-align: center;
    box-shadow: 0 4px 12px rgba(244, 182, 194, 0.25);
    margin-bottom: 8px;
    position: relative;
    transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
  }

  .mascot-bubble::after {
    content: "";
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 8px 7px 0;
    border-style: solid;
    border-color: #f4b6c2 transparent transparent transparent;
  }

  /* 打架狀態下的提示框強調樣式 */
  .mascot-container[data-state="fight"] .mascot-bubble {
    background: #fff4f6;
    border-color: #ff6b8b;
    color: #d6335c;
    cursor: pointer;
    animation: bubble-bounce 1.2s infinite ease-in-out;
  }

  .mascot-container[data-state="fight"] .mascot-stage {
    cursor: pointer;
  }

  .mascot-stage img {
    width: 155px;
    height: auto;
    display: block;
    /* 若 GIF 背景為純白，可開啟 multiply 讓白底自然融入淺色網頁背景 */
    mix-blend-mode: multiply;
    transition: transform 0.2s ease;
  }

  .mascot-container[data-state="fight"] .mascot-stage:hover img {
    transform: scale(1.04);
  }

  @keyframes bubble-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  @media (max-width: 640px) {
    .mascot-container {
      right: 12px;
      bottom: 12px;
    }
    .mascot-stage img {
      width: 120px;
    }
    .mascot-bubble {
      font-size: 12px;
      max-width: 170px;
      padding: 6px 10px;
    }
  }
</style>

<script>
  (function () {
    const widget = document.getElementById("luoluo-mascot-widget");
    const bubble = document.getElementById("mascot-speech-bubble");
    const img = document.getElementById("mascot-gif");

    // 5 支 GIF 的路徑設定（可依實際存放位置調整）
    const gifs = {
      intro: "{{ '/intro.gif' | relative_url }}",
      fight: "{{ '/fight.gif' | relative_url }}",
      bonk:  "{{ '/bonk.gif' | relative_url }}",
      pet:   "{{ '/pet.gif' | relative_url }}",
      sleep: "{{ '/sleep.gif' | relative_url }}"
    };

    // 各幕顯示時間（毫秒），可依 GIF 實際長度微調
    const durations = {
      intro: 4500, // 開場揮手抱抱播放 4.5 秒後開始搶軟糖
      bonk:  2200, // 球棒敲頭轉場播放 2.2 秒後進入摸頭和好
      pet:   4500  // 得逞摸頭和好播放 4.5 秒後一起睡覺
    };

    // 預載所有 GIF 避免切換時閃爍
    Object.values(gifs).forEach((src) => {
      const preload = new Image();
      preload.src = src;
    });

    let currentState = "intro";
    let timer = null;

    function setState(newState, text) {
      currentState = newState;
      widget.setAttribute("data-state", newState);
      bubble.textContent = text;
      // 加上時間戳參數確保每次切換都從 GIF 第一格開始播放
      img.src = gifs[newState] + "?t=" + Date.now();
    }

    // 1. 剛進入畫面：播放 intro，結束後自動進入無限循環的 fight
    timer = setTimeout(() => {
      setState("fight", "打架了！點一下勸架 🍬");
    }, durations.intro);

    // 2. 點擊 widget（僅在 fight 狀態可觸發勸架；若睡著後再點擊可重播開場）
    widget.addEventListener("click", () => {
      if (currentState === "fight") {
        clearTimeout(timer);
        // 第 3 幕：讀者拿球棒敲大狗狗一下
        setState("bonk", "咚！不准搶小熊軟糖！");

        timer = setTimeout(() => {
          // 第 4 幕：蘿蘿得逞藏軟糖並摸摸委屈大狗狗的頭
          setState("pet", "乖乖～不哭不哭（偷藏軟糖）");

          timer = setTimeout(() => {
            // 第 5 幕：和好後一起靠著呼呼大睡
            setState("sleep", "玩累了，一起睡覺陪你讀書 Zzz...");
          }, durations.pet);
        }, durations.bonk);
      } else if (currentState === "sleep") {
        // 睡覺狀態下如果讀者再點一下，可以重新叫醒他們從頭演一次！
        clearTimeout(timer);
        setState("intro", "哈囉大家好！我是蘿蘿～這是我的大狗狗！");
        timer = setTimeout(() => {
          setState("fight", "打架了！點一下勸架 🍬");
        }, durations.intro);
      }
    });
  })();
</script>
